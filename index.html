<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GC Student NFC Profile | USM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    /* BODY WITH SOFTENED PATTERN + GRADIENT */
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15)), /* softens pattern */
        url('pattern.png') repeat,           /* your existing pattern */
        linear-gradient(135deg, #5a2d82, #1ecad3); /* gradient underneath */
      background-blend-mode: overlay;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* CARD STYLING WITH SOFT GLOW ANIMATION */
    .card {
      background: rgba(255, 255, 255, 0.95);
      width: 100%;
      max-width: 390px;
      border-radius: 28px;
      padding: 20px 22px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
      position: relative;
      animation: cardGlow 5s ease-in-out infinite alternate;
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
      50% { box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
      100% { box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
    }

     /* Logos - same size and centered */
	 
    .logos {
      display: flex;
      justify-content: center;  /* center logos horizontally */
      align-items: center;      /* vertically align */
      gap: 15px;                /* space between logos */
      margin-bottom: 5px;
    }

    .logos img {
      width: 10px;      /* same width for all logos */
      height: 40px;     /* same height for all logos */
      object-fit: contain; /* preserve aspect ratio */
    }

    /* Profile image with hover lift */
    .profile {
      display: flex;
      justify-content: center;
      margin: 18px 0 24px;
    }

    .profile img {
      width: 110px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #eee;
      background: #f5f5f5;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .profile img:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }

    /* Info section */
    .info {
      display: grid;
      row-gap: 14px;
      margin-bottom: 24px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 1px;
      color: #777;
    }

    .value {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      margin-top: 2px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #e6e6e6;
      margin: 18px 0;
    }

    /* Buttons with animated gradient */
    .actions {
      display: grid;
      row-gap: 14px;
    }

    .btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      z-index: 0;
      background: linear-gradient(90deg, #5a2d82, #1ecad3, #5a2d82);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-top: 18px;
    }

	
  </style>
</head>
